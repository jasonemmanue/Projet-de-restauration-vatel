# Construction iOS et Android chez Codemagic.
# Le projet Flutter est dans app/, pas a la racine : chaque flux pose working_directory: app.
# Les branches ios/build-check, ios/simulateur et android/apk ne portent pas de code :
# on y pousse l'etat de main, elles ne servent qu'a declencher une construction.

definitions:
  env_commun: &env_commun
    flutter: 3.38.4
    xcode: latest
    cocoapods: default
    vars:
      API_URL: https://projet-de-restauration-vatel-production.up.railway.app/api/v1
      SITE_URL: https://cantine-vatel.web.app

workflows:
  ios-build-check:
    name: iOS, contrôle de construction
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: app
    environment:
      <<: *env_commun
    triggering:
      events: [push]
      branch_patterns:
        - pattern: ios/build-check
          include: true
    scripts:
      - name: Dépendances
        script: flutter pub get
      - name: Contrôles
        script: |
          flutter analyze
          flutter test
      - name: Construire sans signature
        script: >
          flutter build ios --release --no-codesign
          --dart-define=API_URL=$API_URL
          --dart-define=SITE_URL=$SITE_URL
    artifacts:
      - build/ios/iphoneos/*.app

  ios-simulateur:
    name: iOS, simulateur
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: app
    environment:
      <<: *env_commun
    triggering:
      events: [push]
      branch_patterns:
        - pattern: ios/simulateur
          include: true
    scripts:
      - name: Dépendances
        script: flutter pub get
      - name: Construire pour le simulateur
        script: >
          flutter build ios --simulator --debug
          --dart-define=API_URL=$API_URL
          --dart-define=SITE_URL=$SITE_URL
      - name: Mettre en archive
        script: |
          cd build/ios/iphonesimulator
          zip -r cantine-vatel-simulateur.zip Runner.app
    artifacts:
      - app/build/ios/iphonesimulator/cantine-vatel-simulateur.zip

  android-apk:
    name: Android, APK
    instance_type: linux_x2
    max_build_duration: 45
    working_directory: app
    environment:
      <<: *env_commun
    triggering:
      events: [push]
      branch_patterns:
        - pattern: android/apk
          include: true
    scripts:
      - name: Dépendances
        script: flutter pub get
      - name: Construire l'APK
        script: >
          flutter build apk --release
          --dart-define=API_URL=$API_URL
          --dart-define=SITE_URL=$SITE_URL
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

  ios-testflight:
    name: iOS, TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: app
    environment:
      flutter: 3.38.4
      xcode: latest
      cocoapods: default
      vars:
        API_URL: https://projet-de-restauration-vatel-production.up.railway.app/api/v1
        SITE_URL: https://cantine-vatel.web.app
        BUNDLE_ID: com.vatel.cantine
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vatel.cantine
      groups:
        - app_store_connect
    triggering:
      events: [push]
      branch_patterns:
        - pattern: ios/testflight
          include: true
    scripts:
      - name: Dépendances
        script: flutter pub get
      - name: Profils de signature
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Construire l'archive
        script: >
          flutter build ipa --release
          --dart-define=API_URL=$API_URL
          --dart-define=SITE_URL=$SITE_URL
          --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
